name: Discord forum topic list

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-forum-topics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      FORUM_CHANNEL_IDS: ${{ secrets.FORUM_CHANNEL_IDS }}
      POST_CHANNEL_ID: ${{ secrets.POST_CHANNEL_ID }}
      BOT_RUN_ONCE: "1"
    steps:
      - name: Get bot files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh the Discord message
        run: python main.py
